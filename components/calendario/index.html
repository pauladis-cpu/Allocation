<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap');
  :root { --fg:#1c2330; --mut:#7a8190; --bd:#dfe3e8; --acc:#1d5bbf; --dis:#c3c8d1; --hoy:#f5a623; --tarde:#e08a00; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"IBM Plex Sans", system-ui, sans-serif; color:var(--fg); background:transparent; user-select:none; }
  .nav { display:flex; justify-content:flex-end; gap:6px; margin-bottom:2px; }
  .nav button { border:1px solid var(--bd); background:#fff; color:var(--fg); border-radius:8px; padding:2px 12px; cursor:pointer; font-size:14px; }
  .nav button:disabled { opacity:.35; cursor:default; }
  .meses { display:flex; flex-wrap:wrap; gap:16px; }
  .mes { flex:1 1 0; min-width:190px; }
  .mes h4 { margin:0 0 4px; font-size:16px; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .dow { font-size:12px; color:var(--mut); text-align:center; padding:2px 0; }
  .d { position:relative; aspect-ratio:1/1; max-height:30px; display:flex; align-items:center; justify-content:center;
       font-size:14px; border:1px solid var(--bd); border-radius:7px; background:#fff; cursor:pointer; }
  .d:hover:not(.dis):not(.sel) { background:#e8f0fc; }
  .d.hoy { border-color:var(--hoy); }
  .d.sel { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:700; }
  .d.dis { color:var(--dis); background:#f6f7f9; cursor:default; }
  .d.vacio { border:none; background:transparent; cursor:default; }
  .d.tarde::after { content:""; position:absolute; right:3px; top:3px; width:6px; height:6px; border-radius:50%; background:var(--tarde); }
  .leyenda { display:flex; flex-wrap:wrap; gap:14px; margin-top:8px; font-size:13px; color:var(--mut); align-items:center; }
  .leyenda i { display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-2px; margin-right:6px; border:1px solid var(--bd); background:#fff; }
  .leyenda i.a { background:var(--acc); border-color:var(--acc); }
  .leyenda i.p { background:#f6f7f9; }
  .leyenda i.t { border-radius:50%; width:8px; height:8px; background:var(--tarde); border-color:var(--tarde); vertical-align:1px; }
</style>
</head>
<body>
<div class="nav"><button id="prev" title="Meses anteriores">&#9664;</button><button id="next" title="Meses siguientes">&#9654;</button></div>
<div class="meses" id="meses"></div>
<div class="leyenda">
  <span><i class="a"></i>A cerrar</span><span><i></i>Sin marcar</span><span><i class="p"></i>Fecha pasada (se descarta)</span>
  <span id="lt" style="display:none"><i class="t"></i>Posterior a «Vigente hasta»</span>
  <span>Shift + click marca un rango</span>
</div>
<script>
  const NMESES = 3;
  const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const DOW = ["L","M","M","J","V","S","D"];
  let hoy = null, tope = null, sel = new Set(), tarde = new Set(), anchor = null, vistaAnio = null, vistaMes = null;

  const iso = (y,m,d) => y + "-" + String(m+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
  const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
  const isoDe = dt => iso(dt.getFullYear(), dt.getMonth(), dt.getDate());

  function send(type, extra) {
    window.parent.postMessage(Object.assign({isStreamlitMessage:true, type:type}, extra), "*");
  }
  function emitir() { send("streamlit:setComponentValue", {value:{sel:Array.from(sel).sort(), n:Date.now()}, dataType:"json"}); }
  function habilitado(s) { return s >= hoy && s <= tope; }

  function clic(s, shift) {
    if (!habilitado(s)) return;
    if (shift && anchor) {
      let a = parse(anchor), b = parse(s);
      if (b < a) { const t = a; a = b; b = t; }
      for (let d = new Date(a); d <= b; d.setDate(d.getDate()+1)) {
        const k = isoDe(d); if (habilitado(k)) sel.add(k);
      }
    } else {
      if (sel.has(s)) sel.delete(s); else sel.add(s);
    }
    anchor = s;
    dibujar(); emitir();
  }

  // Navegación acotada: del mes de hoy al mes de hoy + 2 años
  function limites() {
    const h = parse(hoy), t = parse(tope);
    return {min: h.getFullYear()*12 + h.getMonth(), max: t.getFullYear()*12 + t.getMonth()};
  }

  function dibujar() {
    const cont = document.getElementById("meses");
    cont.innerHTML = "";
    for (let i = 0; i < NMESES; i++) {
      const base = new Date(vistaAnio, vistaMes + i, 1);
      const y = base.getFullYear(), m = base.getMonth();
      const mes = document.createElement("div"); mes.className = "mes";
      mes.innerHTML = "<h4>" + MESES[m] + " " + y + "</h4>";
      const g = document.createElement("div"); g.className = "grid";
      DOW.forEach(t => { const e = document.createElement("div"); e.className = "dow"; e.textContent = t; g.appendChild(e); });
      const offset = (base.getDay() + 6) % 7;
      for (let k = 0; k < offset; k++) { const e = document.createElement("div"); e.className = "d vacio"; g.appendChild(e); }
      const ndias = new Date(y, m + 1, 0).getDate();
      for (let d = 1; d <= ndias; d++) {
        const s = iso(y, m, d);
        const e = document.createElement("div");
        e.className = "d" + (habilitado(s) ? "" : " dis") + (sel.has(s) ? " sel" : "") + (s === hoy ? " hoy" : "")
                    + (tarde.has(s) && sel.has(s) ? " tarde" : "");
        e.textContent = d;
        e.addEventListener("click", ev => clic(s, ev.shiftKey));
        g.appendChild(e);
      }
      mes.appendChild(g); cont.appendChild(mes);
    }
    const L = limites(), actual = vistaAnio*12 + vistaMes;
    document.getElementById("prev").disabled = actual <= L.min;
    document.getElementById("next").disabled = actual + NMESES > L.max;
    document.getElementById("lt").style.display = tarde.size ? "" : "none";
    send("streamlit:setFrameHeight", {height: document.body.scrollHeight + 8});
  }

  function mover(delta) {
    const L = limites();
    let destino = vistaAnio*12 + vistaMes + delta;
    destino = Math.max(L.min, Math.min(destino, Math.max(L.min, L.max - NMESES + 1)));
    vistaAnio = Math.floor(destino/12); vistaMes = destino % 12; dibujar();
  }
  document.getElementById("prev").addEventListener("click", () => mover(-NMESES));
  document.getElementById("next").addEventListener("click", () => mover(NMESES));

  window.addEventListener("message", ev => {
    if (!ev.data || ev.data.type !== "streamlit:render") return;
    const a = ev.data.args || {};
    const primera = hoy === null;
    hoy = a.hoy; tope = a.tope;
    sel = new Set(a.seleccion || []);
    tarde = new Set(a.tarde || []);
    if (primera) {
      const h = parse(hoy); vistaAnio = h.getFullYear(); vistaMes = h.getMonth();
    }
    dibujar();
  });
  send("streamlit:componentReady", {apiVersion:1});
</script>
</body>
</html>
